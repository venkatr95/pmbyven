name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: file:./prisma/ci.db
  ADMIN_SECRET: ci-test-secret
  NEXT_PUBLIC_SITE_NAME: Editorial
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_PUBLIC_SITE_DESCRIPTION: CI build
  # Skip native DB adapter issues during pure unit tests
  CI: true

jobs:
  lint-typecheck-test:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit & component tests
        run: npm run test:ci

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: [lint-typecheck-test]
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Push schema (SQLite CI DB)
        run: npx prisma db push

      - name: Seed demo data
        run: npm run db:seed

      - name: Build Next.js
        run: npm run build
        env:
          # Build-time public env
          NEXT_PUBLIC_SITE_URL: https://example.com
